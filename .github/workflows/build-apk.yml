name: Build StreamFlix Signed APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: streamflix-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-cleanup: on-success

      - name: Check Environment
        run: |
          java -version
          gradle --version

      - name: Create CI Keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/streamflix-release.jks" \
            -storetype PKCS12 \
            -alias streamflix \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=StreamFlix,O=StreamFlix,L=India,C=IN"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/streamflix-release.jks
          STORE_PASSWORD: android
          KEY_ALIAS: streamflix
          KEY_PASSWORD: android
        run: |
          gradle --no-daemon --stacktrace clean assembleRelease -x test

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for Release APK..."

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          cp "$APK" \
            "app/build/outputs/apk/release/StreamFlix-Signed-Release.apk"

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/StreamFlix-Signed-Release.apk"

          test -f "$APK"

          echo "Final APK:"
          ls -lh "$APK"

          echo "APK verification:"
          apksigner verify --verbose "$APK" || true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlix-Signed-Release
          path: app/build/outputs/apk/release/StreamFlix-Signed-Release.apk
          if-no-files-found: error
          retention-days: 30
